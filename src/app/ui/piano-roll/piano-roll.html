<div class="scroller" #scroller>
  <div class="corner"></div>
  <div class="ruler" [style.width.px]="width()">
    @for (label of measureLabels(); track label.number) {
      <span class="measure-number" [style.left.px]="label.x">{{ label.number }}</span>
    }
  </div>

  <svg class="keys" [attr.height]="height()" width="48" aria-hidden="true">
    @for (pitch of pitches(); track pitch) {
      <rect
        x="0"
        [attr.y]="rowY(pitch)"
        width="48"
        [attr.height]="layout().rowHeight"
        [class.black]="isBlack(pitch)"
        class="key"
      />
      @if (keyLabel(pitch)) {
        <text x="44" [attr.y]="rowY(pitch) + layout().rowHeight - 3" class="key-label">
          {{ keyLabel(pitch) }}
        </text>
      }
    }
  </svg>

  <svg
    class="grid"
    [class.resize-cursor]="overResizeHandle()"
    [attr.width]="width()"
    [attr.height]="height()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="cancelDrag()"
    (contextmenu)="onContextMenu($event)"
  >
    @for (pitch of pitches(); track pitch) {
      <rect
        x="0"
        [attr.y]="rowY(pitch)"
        [attr.width]="width()"
        [attr.height]="layout().rowHeight"
        [class.black]="isBlack(pitch)"
        class="row"
      />
    }
    @for (line of lines(); track line.x) {
      <line
        [attr.x1]="line.x"
        [attr.x2]="line.x"
        y1="0"
        [attr.y2]="height()"
        [class.strong]="line.strong"
        class="grid-line"
      />
    }
    @for (note of notes(); track note.id) {
      <rect
        class="note"
        [class.selected]="note.selected"
        [attr.x]="note.rect.x"
        [attr.y]="note.rect.y + 1"
        [attr.width]="note.rect.width"
        [attr.height]="note.rect.height - 2"
        rx="3"
        [attr.data-note-id]="note.id"
      >
        <title>{{ note.label }}</title>
      </rect>
    }
  </svg>
</div>
