<div class="scroller" #scroller>
  <div class="ruler" [style.height.px]="height()">
    @for (label of measureLabels(); track label.number) {
      <span class="measure-number" [style.top.px]="label.y - 16">{{ label.number }}</span>
    }
  </div>

  <svg
    class="grid"
    [class.resize-cursor]="overResizeHandle()"
    [attr.width]="width()"
    [attr.height]="height()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="cancelDrag()"
    (contextmenu)="onContextMenu($event)"
  >
    @for (key of keys(); track key.pitch) {
      @if (key.black) {
        <rect
          class="column black"
          [attr.x]="key.rect.x"
          y="0"
          [attr.width]="key.rect.width"
          [attr.height]="height()"
        />
      }
    }
    @for (line of lines(); track line.y) {
      <line
        x1="0"
        [attr.x2]="width()"
        [attr.y1]="line.y"
        [attr.y2]="line.y"
        [class.strong]="line.strong"
        class="grid-line"
      />
    }
    @for (note of notes(); track note.id) {
      <rect
        class="note"
        [class.selected]="note.selected"
        [attr.x]="note.rect.x + 1"
        [attr.y]="note.rect.y"
        [attr.width]="note.rect.width - 2"
        [attr.height]="note.rect.height"
        rx="3"
        [attr.data-note-id]="note.id"
      >
        <title>{{ note.label }}</title>
      </rect>
    }
    @if (session.playing()) {
      <line
        class="playhead"
        x1="0"
        [attr.x2]="width()"
        [attr.y1]="playheadY()"
        [attr.y2]="playheadY()"
      />
    }
  </svg>

  <div class="corner"></div>

  <svg class="keyboard" [attr.width]="width()" [attr.height]="keyboardHeight" aria-hidden="true">
    @for (key of keys(); track key.pitch) {
      <rect
        class="key"
        [class.black]="key.black"
        [class.active]="activePitches().has(key.pitch)"
        [attr.x]="key.rect.x"
        [attr.y]="key.rect.y"
        [attr.width]="key.rect.width"
        [attr.height]="key.rect.height"
        rx="2"
      />
      @if (key.label) {
        <text
          class="key-label"
          [attr.x]="key.rect.x + key.rect.width / 2"
          [attr.y]="keyboardHeight - 6"
        >
          {{ key.label }}
        </text>
      }
    }
  </svg>
</div>
